<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9f2">
  <title>POPコンテスト｜あなたの一票を</title>
  <style>
    :root{--ink:#392a27;--green:#7c4e41;--paper:#fff9f2;--card:#fffdf9;--orange:#b95f46;--line:#ead9cb;--muted:#806b62}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#fff1e2 0,#fff9f2 460px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
    header{background:#fff9f2d9;color:#67483d;padding:15px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;border-bottom:1px solid #ead9cb99;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;font-weight:700;letter-spacing:.07em;font-size:.9rem}
    main{max-width:1240px;margin:auto;padding:34px 22px 76px}.hero{position:relative;overflow:hidden;padding:40px 22px 32px;text-align:center;border:1px solid #f1dfcf;border-radius:32px;background:linear-gradient(135deg,#f9e7d6 0%,#fff5eb 54%,#fffaf4 100%);box-shadow:0 14px 35px #81574410}.hero:after{content:"";position:absolute;width:240px;height:240px;right:-85px;top:-124px;border-radius:50%;border:1px solid #d6a58b55;box-shadow:0 0 0 22px #d6a58b12,0 0 0 46px #d6a58b0b;pointer-events:none}.eyebrow{color:var(--orange);font:700 .72rem Georgia,serif;letter-spacing:.22em}.hero h1{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.34;margin:9px 0 12px;font-weight:700;letter-spacing:.025em}.hero p{max-width:660px;margin:0 auto;color:#725c53;font-size:.94rem}.notice{margin:21px auto 0;max-width:750px;border:1px solid #efd4c4;background:#fff9f4;border-radius:16px;padding:12px 18px;color:#805342;font-size:.9rem;box-shadow:0 4px 14px #7e4a3210}.notice strong{display:block;color:#704337}
    .toolbar{display:flex;align-items:center;gap:12px;margin:34px 0 15px;padding:0 2px 10px;border-bottom:1px solid var(--line)}.toolbar:before{content:"";width:4px;height:20px;border-radius:4px;background:var(--orange)}.toolbar h2{font-size:1.14rem;margin:0;font-weight:700;letter-spacing:.04em}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid #ebddcf;border-radius:18px;overflow:hidden;box-shadow:0 5px 17px #6943300c;transition:transform .2s,box-shadow .2s,border-color .2s}.card:hover{transform:translateY(-3px);box-shadow:0 11px 24px #69433018}.card.selected{border:2px solid var(--orange);box-shadow:0 0 0 3px #b95f4620,0 10px 24px #69433015}.card-head{display:flex;align-items:center;justify-content:space-between;padding:9px 11px 7px}.number{font-size:.96rem;color:var(--green);font-weight:700;letter-spacing:.035em}.pick{accent-color:var(--orange);width:18px;height:18px;cursor:pointer}.thumb{display:block;width:calc(100% - 12px);height:200px;margin:0 6px 7px;border-radius:11px;background:#f5ece3;object-fit:contain;cursor:zoom-in}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 6px 7px}.pair figure{margin:0;min-width:0}.pair img{display:block;width:100%;height:200px;border-radius:9px;object-fit:contain;background:#f5ece3;cursor:zoom-in}.pair figcaption{display:none}.card-head{cursor:pointer}.card-head:focus-within{outline:2px solid #b95f4680;outline-offset:-3px}.pick{flex:0 0 auto}
    .submit-area{display:none;position:sticky;bottom:12px;z-index:3;margin:26px auto 0;width:fit-content;min-width:min(100%,370px);max-width:440px;background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:11px 13px;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 8px 28px #74452b20}.submit-area.active{display:flex}.selected-label{font-weight:700}.selected-label small{display:block;font-weight:400;color:var(--muted)}.submit{background:var(--orange);border:0;color:white;border-radius:13px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}.submit:disabled{opacity:.48;cursor:not-allowed}
    footer{background:#f6eade;padding:24px 20px;text-align:center;color:#816a60;font-size:.76rem;border-top:1px solid #ead9cb}footer .credit{font-size:.72rem;letter-spacing:.03em;margin-top:7px;color:#9a8578}.results-link{display:inline-block;margin-bottom:6px;color:#9a8578;text-decoration:none;border-bottom:1px solid #cbb6a7;font-size:.72rem}
    dialog{border:0;border-radius:18px;padding:52px 22px 18px;background:#322723;max-width:96vw;max-height:94vh;color:#fff9f2;box-shadow:0 20px 70px #160d0a66}dialog::backdrop{background:#241a16d9;backdrop-filter:blur(3px)}.lightbox{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:12px;width:min(88vw,1100px);margin:auto;position:relative}.lightbox img{display:block;width:auto;height:auto;max-width:100%;max-height:82vh;object-fit:contain;touch-action:pan-y}.close{position:absolute;top:10px;right:12px;border:0;border-radius:50%;width:40px;height:40px;background:#fff9f2;color:#49352d;font-size:1.4rem;cursor:pointer}.nav-photo{justify-self:center;z-index:1;border:1px solid #fff5;background:#ffffff12;color:#fff9f2;border-radius:50%;width:44px;height:44px;font-size:1.4rem;cursor:pointer;flex:0 0 auto}.nav-photo:hover{background:#ffffff25}.photo-count{margin:9px 0 0;text-align:center;color:#fff9f2bb;font-size:.8rem;letter-spacing:.08em}.toast{position:fixed;inset:auto 16px 110px;z-index:5;margin:auto;max-width:520px;background:#19352a;color:white;padding:16px 18px;border-radius:12px;box-shadow:0 8px 24px #0003;display:none}.toast.show{display:block}.card-head{cursor:default}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.thumb,.pair img{height:176px}}
    @media(max-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.thumb,.pair img{height:148px}}
    @media(max-width:480px){header{padding:11px 13px}main{padding:16px 10px 56px}.hero{padding:24px 12px 20px;border-radius:24px}.hero h1{font-size:1.58rem}.hero p{font-size:.78rem}.notice{margin-top:15px;padding:9px 10px;font-size:.72rem;text-align:center;border-radius:13px}.toolbar{margin:25px 0 11px}.grid{gap:7px}.card{border-radius:13px}.card-head{padding:6px 7px 5px}.number{font-size:.73rem}.pick{width:14px;height:14px}.thumb,.pair img{height:112px;width:calc(100% - 8px);margin:0 4px 5px;border-radius:7px}.pair{gap:2px;padding:0 4px 5px}.pair img{width:100%;margin:0}.submit-area{bottom:8px;padding:9px 10px;border-radius:15px}.submit{padding:9px 10px;font-size:.76rem}.selected-label{font-size:.8rem}.selected-label small{font-size:.68rem}dialog{padding:52px 10px 15px}.lightbox{grid-template-columns:34px minmax(0,1fr) 34px;gap:5px;width:88vw}.nav-photo{width:32px;height:38px;font-size:1.15rem}.lightbox img{max-height:78vh}.close{top:8px;right:8px}}
  </style>
</head>
<body>
  <header><div class="brand">一宮高校図書委員会</div></header>
  <main>
    <section class="hero">
      <div class="eyebrow">BOOK POP CONTEST</div>
      <h1>あなたの一票で、<br>お気に入りを応援しよう。</h1>
      <p>写真を見て、あなたが一番気に入ったポップをひとつ選んでください。作品の写真を押すと大きく表示できます。</p>
      <div class="notice"><strong>投票は一人一票です</strong>ポスターで投票した人は、このサイトでは投票しないでください。</div>
    </section>
    <div class="toolbar"><h2>ポップ作品</h2></div>
    <section class="grid" id="gallery" aria-label="ポップ作品一覧"></section>
    <div class="submit-area"><div class="selected-label" id="selectedLabel">作品を選んでください<small>選んだ作品に投票します</small></div><button class="submit" id="submitVote" disabled>このポップに投票する</button></div>
  </main>
  <footer><a class="results-link" href="results.html">投票結果を見る</a><div>POPコンテスト</div><div class="credit">作成：一宮高等学校 図書委員会・塚田</div></footer>
  <dialog id="viewer" aria-label="写真を拡大表示"><button class="close" aria-label="閉じる">×</button><div class="lightbox"><button class="nav-photo prev" aria-label="前の写真">‹</button><img alt="拡大写真"><button class="nav-photo next" aria-label="次の写真">›</button></div><p class="photo-count" aria-live="polite"></p></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="config.js"></script>
  <script>
    const gallery=document.querySelector('#gallery');let selected=null;
    for(let n=1;n<=15;n++){
      const id=String(n).padStart(2,'0');const card=document.createElement('article');card.className='card';card.dataset.number=id;
      const photo=(src,alt,caption='')=>`<figure><img src="assets/${src}" alt="${alt}" loading="lazy" data-zoom="assets/${src}">${caption?`<figcaption>${caption}</figcaption>`:''}</figure>`;
      card.innerHTML=`<div class="card-head"><span class="number">No.${n}</span><input class="pick" type="radio" name="entry" value="${id}" aria-label="No.${n}に投票"></div>${n===6?`<div class="pair">${photo('06-a.jpg','No.6のポップ')}${photo('06-b.jpg','No.6のポップ')}</div>`:`<img class="thumb" src="assets/${id}.jpg" alt="No.${n}のポップ" loading="lazy" data-zoom="assets/${id}.jpg">`}`;
      gallery.append(card);
    }
    const label=document.querySelector('#selectedLabel'),submit=document.querySelector('#submitVote');
    gallery.addEventListener('change',e=>{if(e.target.matches('.pick')){selected=e.target.value;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.number===selected));label.innerHTML=`No.${Number(selected)}を選択中<small>投票内容をご確認ください</small>`;submit.disabled=false;document.querySelector('.submit-area').classList.add('active');}});
    const viewer=document.querySelector('#viewer'),viewerImage=viewer.querySelector('img'),counter=viewer.querySelector('.photo-count');let photoSet=[],photoIndex=0,touchStartX=0;
    function showPhoto(index){photoIndex=(index+photoSet.length)%photoSet.length;const photo=photoSet[photoIndex];viewerImage.src=photo.src;viewerImage.alt=photo.alt;counter.textContent=photoSet.length>1?`${photoIndex+1} / ${photoSet.length}`:'';viewer.querySelectorAll('.nav-photo').forEach(b=>{b.style.visibility=photoSet.length>1?'visible':'hidden';b.disabled=photoSet.length<2})}
    gallery.addEventListener('click',e=>{const image=e.target.closest('[data-zoom]');if(image){const card=image.closest('.card');photoSet=card.dataset.number==='06'?[...card.querySelectorAll('[data-zoom]')].map(el=>({src:el.dataset.zoom,alt:el.alt})):[{src:image.dataset.zoom,alt:image.alt}];showPhoto([...card.querySelectorAll('[data-zoom]')].indexOf(image));viewer.showModal();return;}const card=e.target.closest('.card');if(card&&e.target.closest('.card-head')&&!e.target.closest('input')){const radio=card.querySelector('.pick');radio.checked=true;radio.dispatchEvent(new Event('change',{bubbles:true}));}});
    viewer.querySelector('.close').addEventListener('click',()=>viewer.close());viewer.querySelector('.prev').addEventListener('click',()=>showPhoto(photoIndex-1));viewer.querySelector('.next').addEventListener('click',()=>showPhoto(photoIndex+1));viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')showPhoto(photoIndex-1);if(e.key==='ArrowRight')showPhoto(photoIndex+1)});viewerImage.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX},{passive:true});viewerImage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchStartX;if(Math.abs(dx)>45)showPhoto(photoIndex+(dx<0?1:-1))},{passive:true});
    const toast=document.querySelector('#toast');function announce(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),5000)}
    const votedKey='ichinomiya-pop-vote-submitted';if(localStorage.getItem(votedKey)){submit.disabled=true;submit.textContent='投票済みです';document.querySelector('.submit-area').classList.add('active');label.innerHTML='この端末から投票済みです<small>ご協力ありがとうございました</small>'}
    function jsonp(url,params){return new Promise((resolve,reject)=>{const cb='popcb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('timeout'))},12000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('network'))};script.src=url+'?'+new URLSearchParams({...params,callback:cb});document.body.append(script)})}
    submit.addEventListener('click',async()=>{if(!selected||submit.disabled)return;const api=window.POP_VOTE_CONFIG.apiUrl;if(!api){announce('投票の送信先がまだ設定されていません。公開前に集計先を接続してください。');return}submit.disabled=true;submit.textContent='送信中…';try{const result=await jsonp(api,{action:'vote',no:Number(selected)});if(!result.ok)throw new Error(result.error||'failed');localStorage.setItem(votedKey,String(Date.now()));submit.textContent='投票済みです';label.innerHTML='投票を受け付けました<small>ご協力ありがとうございました</small>';announce('投票を受け付けました。ありがとうございました。')}catch(error){submit.disabled=false;submit.textContent='このポップに投票する';announce('送信できませんでした。通信状況を確認して、もう一度お試しください。')}});
  </script>
</body>
</html>
